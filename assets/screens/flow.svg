<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 348" width="816" height="348" role="img" aria-label="Схема обмена приложения с сервером" font-family="'Golos Text','PT Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="816" height="348" rx="10" fill="#1A1A2E"/>

  <text x="28" y="36" fill="#EDECF3" font-size="15.5" font-weight="700" text-anchor="start">Как показание попадает на сервер</text>
  <text x="28" y="57" fill="#9095AE" font-size="11" font-weight="400" text-anchor="start">Одно показание — два обращения к бэкенду. Список за день запрашивается отдельно.</text>

  <rect x="28" y="92" width="140" height="66" rx="8" fill="#262640" stroke="#3A3A5E" stroke-width="1"/><text x="98.0" y="119" fill="#EDECF3" font-size="13.5" font-weight="600" text-anchor="middle">Камера</text><text x="98.0" y="138" fill="#9095AE" font-size="10.5" font-weight="normal" text-anchor="middle">снимок счётчика</text>
  <rect x="318" y="92" width="160" height="66" rx="8" fill="#262640" stroke="#C8102E" stroke-width="1.6"/><text x="398.0" y="119" fill="#EDECF3" font-size="13.5" font-weight="600" text-anchor="middle">Проверка данных</text><text x="398.0" y="138" fill="#9095AE" font-size="10.5" font-weight="normal" text-anchor="middle">поля можно править</text>
  <rect x="628" y="92" width="160" height="66" rx="8" fill="#262640" stroke="#3A3A5E" stroke-width="1"/><text x="708.0" y="119" fill="#EDECF3" font-size="13.5" font-weight="600" text-anchor="middle">Сохранено</text><text x="708.0" y="138" fill="#9095AE" font-size="10.5" font-weight="normal" text-anchor="middle">запись создана</text>

  <path d="M168 125 L311 125" stroke="#E8425A" stroke-width="1.4" fill="none"/><path d="M310 121 L318 125 L310 129z" fill="#E8425A"/><text x="243.0" y="114" fill="#E8425A" font-size="10.5" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Consolas,'Liberation Mono',monospace">POST /api/upload</text><text x="243.0" y="146" fill="#6E7391" font-size="9.5" font-weight="normal" text-anchor="middle">фото → распознавание</text>
  <path d="M478 125 L621 125" stroke="#E8425A" stroke-width="1.4" fill="none"/><path d="M620 121 L628 125 L620 129z" fill="#E8425A"/><text x="553.0" y="114" fill="#E8425A" font-size="10.5" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Consolas,'Liberation Mono',monospace">POST /api/confirm</text><text x="553.0" y="146" fill="#6E7391" font-size="9.5" font-weight="normal" text-anchor="middle">подтверждённые поля</text>

  <line x1="28" y1="204" x2="788" y2="204" stroke="#3A3A5E" stroke-width="1"/>

  <rect x="28" y="228" width="190" height="60" rx="8" fill="#262640" stroke="#3A3A5E" stroke-width="1"/><text x="123.0" y="255" fill="#EDECF3" font-size="13.5" font-weight="600" text-anchor="middle">Показания за сегодня</text><text x="123.0" y="274" fill="#9095AE" font-size="10.5" font-weight="normal" text-anchor="middle">список с поиском</text>
  <path d="M400 258 L225 258" stroke="#E8425A" stroke-width="1.4" fill="none"/><path d="M226 254 L218 258 L226 262z" fill="#E8425A"/><text x="309.0" y="247" fill="#E8425A" font-size="10.5" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Consolas,'Liberation Mono',monospace">GET /api/today</text><text x="309.0" y="279" fill="#6E7391" font-size="9.5" font-weight="normal" text-anchor="middle">записи текущего дня</text>
  <rect x="582" y="228" width="206" height="60" rx="8" fill="#262640" stroke="#3A3A5E" stroke-width="1"/><text x="685.0" y="255" fill="#EDECF3" font-size="13.5" font-weight="600" text-anchor="middle">Бэкенд</text><text x="685.0" y="274" fill="#9095AE" font-size="10.5" font-weight="normal" text-anchor="middle">meter.mosoblenergo.ru</text>

  <text x="28" y="328" fill="#6E7391" font-size="10" font-weight="400" text-anchor="start">Адрес бэкенда задаётся в настройках и хранится на телефоне под ключом @meter_parser_api_url</text>
</svg>
